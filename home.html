<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="真實的郵輪與河輪旅遊評價，幫助你找到最適合自己的下一趟航程。">
  <title>郵輪評價誌｜真實旅程，真實評價</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="menu"></div>

  <main class="content">
    <div class="page-shell">
      <section class="home-hero">
        <img src="/images/hero.jpg" alt="郵輪航行於海上的風景">
        <a class="hero-account-link" href="/account" data-auth-link>登入／註冊</a>
        <div class="hero-copy">
          <p class="eyebrow">Independent cruise reviews</p>
          <h1>找到屬於你的<br>完美航程</h1>
          <p>
            從真實旅客的住宿、餐飲、服務與設施評價中，
            認識每一艘郵輪，安心選擇下一趟旅程。
          </p>
          <div class="button-row">
            <a class="button button-primary" href="/cruise-lines/msc">瀏覽郵輪評價</a>
            <a class="button button-ghost" href="/add-review">分享你的體驗</a>
          </div>
        </div>
      </section>

      <section class="home-about">
        <div>
          <p class="eyebrow">關於我們</p>
          <h2>以旅人的眼光，記錄海上的每一段故事</h2>
        </div>
        <p>
          我們是蜜拉士愷，分享郵輪、火車、環遊世界與數位遊牧的生活，
          也出版過多本旅遊與散文書籍。這裡收集真正搭乘過郵輪的旅客心得，
          希望讓每個人都能更容易找到適合自己的船與航程。
        </p>
      </section>
    </div>
  </main>

  <script src="/catalog-data.js"></script>
  <script src="/auth-client.js"></script>
  <script src="/site.js"></script>
</body>
</html>
