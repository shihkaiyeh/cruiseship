<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="瀏覽郵輪公司的船隊與真實旅客評價。">
  <title>郵輪公司評價｜郵輪評價誌</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="menu"></div>

  <main class="content">
    <div class="page-shell">
      <section class="header-box" id="lineHeader">
        <img src="./images/hero.jpg" alt="郵輪航行於海上的風景">
        <div class="header-content">
          <div>
            <p class="eyebrow">Cruise line reviews</p>
            <h1><span id="lineName">郵輪公司</span><br>旅客評價</h1>
          </div>
          <div class="header-actions">
            <div class="rating-summary" aria-label="旅客平均評分">
              <strong class="rating-average" data-rating-average>—</strong>
              <div class="rating-summary-details">
                <span class="rating-stars" data-rating-stars aria-hidden="true">★★★★★</span>
                <span class="rating-count" data-rating-count>正在計算評價…</span>
              </div>
            </div>
            <a class="add-button" id="addLineReview" href="add-review.html">分享搭乘體驗</a>
          </div>
        </div>
      </section>

      <section class="fleet-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Fleet directory</p>
            <h2 id="fleetHeading">選擇郵輪</h2>
          </div>
          <label class="catalog-filter">
            <span class="sr-only">搜尋這家公司的郵輪</span>
            <input type="search" id="fleetSearch" placeholder="搜尋郵輪名稱…">
          </label>
        </div>
        <div id="fleetGrid" class="fleet-grid"></div>
      </section>

      <div class="reviews-heading">
        <h2>所有最新評價</h2>
        <span>所有內容皆由旅客親自分享</span>
      </div>
      <section id="reviews" aria-live="polite"></section>
    </div>
  </main>

  <script src="./catalog-data.js"></script>
  <script src="./site.js"></script>
  <script src="./reviews.js"></script>
  <script src="./line-page.js"></script>
</body>
</html>
