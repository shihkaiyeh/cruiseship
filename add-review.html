<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="分享你的郵輪搭乘體驗，幫助其他旅客選擇適合自己的航程。">
  <title>新增評價｜郵輪評價誌</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="menu"></div>

  <main class="content">
    <div class="page-shell">
      <header class="form-page-header">
        <p class="eyebrow">Share your journey</p>
        <h1 class="page-title" id="reviewPageTitle">分享你的搭乘體驗</h1>
        <p class="page-intro">你的真實心得，能幫助下一位旅客做出更適合自己的選擇。</p>
      </header>

      <section class="form-box">
        <h1 id="reviewFormTitle">新增評價</h1>
        <p class="form-lead" id="reviewFormLead">所有評價送出後會先經過管理員審核，再顯示於網站上。</p>

        <div id="reviewLoginRequired" class="auth-required" hidden>
          <p class="auth-step-label">需要登入</p>
          <h2>請先登入，才能分享你的搭乘體驗。</h2>
          <p>登入後會自動回到這個頁面。</p>
          <a id="reviewLoginLink" class="add-button" href="/account">登入／建立帳號</a>
        </div>

        <div id="reviewLoadError" class="auth-required" hidden>
          <p class="auth-step-label">無法編輯</p>
          <h2 id="reviewLoadErrorTitle">找不到這則評價。</h2>
          <p id="reviewLoadErrorText">這則評價可能已被刪除，或不屬於你的帳號。</p>
          <a class="add-button" href="/account">回到我的帳號</a>
        </div>

        <form id="reviewForm" hidden>
          <p id="editApprovalNotice" class="form-notice" hidden>
            修改後，評價將重新送交審核，審核期間不會顯示在網站上。
          </p>
          <div class="form-grid">
            <div class="field field-full">
              <label for="title">評價標題</label>
              <input type="text" id="title" maxlength="120" required>
            </div>

            <div class="field field-full">
              <label for="text">你的評價</label>
              <textarea id="text" maxlength="5000" required></textarea>
            </div>

            <div class="field">
              <label for="line">郵輪公司</label>
              <input
                type="text"
                id="line"
                list="line-options"
                placeholder="輸入名稱或從清單選擇…"
                autocomplete="off"
                required
              >
              <datalist id="line-options"></datalist>
            </div>

            <div class="field" id="ship-container">
              <label for="ship">郵輪名稱</label>
              <input
                type="text"
                id="ship"
                list="ship-options"
                placeholder="請先選擇郵輪公司"
                autocomplete="off"
                required
                disabled
              >
              <datalist id="ship-options"></datalist>
              <small class="field-help">可以輸入名稱的前幾個字母快速搜尋。</small>
            </div>

            <div class="field">
              <label for="date">搭船日期</label>
              <input type="date" id="date" required>
            </div>

            <div class="field review-author-field" aria-live="polite">
              <p class="review-publish-as">
                將以 <strong id="reviewAuthorName"></strong> 的名稱發布
              </p>
            </div>

            <h2 class="ratings-title">各項評分</h2>
            <div class="rating-fields">
              <div class="field rating-field">
                <label for="decor">裝潢與設施</label>
                <select id="decor">
                  <option value="1">1 星</option><option value="2">2 星</option>
                  <option value="3">3 星</option><option value="4">4 星</option>
                  <option value="5" selected>5 星</option>
                </select>
              </div>
              <div class="field rating-field">
                <label for="room">客房</label>
                <select id="room">
                  <option value="1">1 星</option><option value="2">2 星</option>
                  <option value="3">3 星</option><option value="4">4 星</option>
                  <option value="5" selected>5 星</option>
                </select>
              </div>
              <div class="field rating-field">
                <label for="service">服務</label>
                <select id="service">
                  <option value="1">1 星</option><option value="2">2 星</option>
                  <option value="3">3 星</option><option value="4">4 星</option>
                  <option value="5" selected>5 星</option>
                </select>
              </div>
              <div class="field rating-field">
                <label for="food">餐飲</label>
                <select id="food">
                  <option value="1">1 星</option><option value="2">2 星</option>
                  <option value="3">3 星</option><option value="4">4 星</option>
                  <option value="5" selected>5 星</option>
                </select>
              </div>
            </div>
          </div>

          <button type="submit" class="add-button form-submit" id="submitButton">送出評價</button>
          <p id="formMessage" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>
  </main>

  <script src="/catalog-data.js"></script>
  <script src="/auth-client.js"></script>
  <script src="/site.js"></script>
  <script src="/add-review.js"></script>
</body>
</html>
