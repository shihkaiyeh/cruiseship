<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="查看真實旅客分享的郵輪搭乘評價。">
  <title>郵輪評價｜郵輪評價誌</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="menu"></div>

  <main class="content">
    <div class="page-shell">
      <section class="header-box" id="shipHeader">
        <img id="shipImage" src="./images/hero.jpg" alt="">
        <div class="header-content">
          <div>
            <p class="eyebrow" id="shipCompany">Cruise ship reviews</p>
            <h1><span id="shipName">郵輪</span><br>旅客評價</h1>
          </div>
          <div class="header-actions">
            <div class="rating-summary" aria-label="旅客平均評分">
              <strong class="rating-average" data-rating-average>—</strong>
              <div class="rating-summary-details">
                <span class="rating-stars" data-rating-stars aria-hidden="true">★★★★★</span>
                <span class="rating-count" data-rating-count>正在計算評價…</span>
              </div>
            </div>
            <a class="add-button" id="addShipReview" href="add-review.html">分享搭乘體驗</a>
            <a class="add-button video-scroll-button" id="shipVideoButton" href="#videoSection" hidden>
              ▶ 觀看完整影片
            </a>
          </div>
        </div>
      </section>

      <div class="reviews-heading">
        <h2>最新評價</h2>
        <span>住宿 · 餐飲 · 服務 · 設施</span>
      </div>
      <section id="reviews" aria-live="polite"></section>

      <section class="video-section" id="videoSection" hidden>
        <div class="video-section-heading">
          <p class="eyebrow">Video experience</p>
          <h2>影音介紹</h2>
          <p>看看我們在 YouTube 上的完整搭乘體驗。</p>
        </div>
        <div class="video-frame">
          <iframe
            id="shipVideoFrame"
            title="郵輪搭乘體驗影片"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </div>
        <a class="youtube-link" id="shipYoutubeLink" href="#" target="_blank" rel="noopener noreferrer">
          前往 YouTube 觀看 ↗
        </a>
      </section>
    </div>
  </main>

  <script src="./catalog-data.js"></script>
  <script src="./site.js"></script>
  <script src="./reviews.js"></script>
  <script src="./ship-page.js"></script>
</body>
</html>
