<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>評價已送出｜郵輪評價誌</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="menu"></div>

  <main class="content thank-you-content">
    <section class="thank-you-card">
      <div class="success-icon" aria-hidden="true">✓</div>
      <p class="eyebrow">Review received</p>
      <h1>謝謝你的分享！</h1>
      <p class="thank-you-lead">你的評價已成功送出。</p>
      <p>
        為了確保內容品質並避免垃圾訊息，評價會先由管理員審核。
        審核通過後，就會顯示在對應的郵輪頁面。
      </p>
      <p class="thank-you-note">你不需要再次送出，我們已經收到這則評價。</p>

      <div class="thank-you-actions">
        <a href="home.html" class="thank-you-button secondary">回到首頁</a>
        <a href="home.html" id="reviewsLink" class="thank-you-button primary">瀏覽郵輪評價</a>
      </div>
    </section>
  </main>

  <script src="./catalog-data.js"></script>
  <script src="./site.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const company = window.CRUISE_CATALOG.getCompany(params.get('line'));
    const ship = window.CRUISE_CATALOG.getShip(params.get('ship'));
    const reviewsLink = document.getElementById('reviewsLink');

    if (ship) {
      reviewsLink.href = `ship.html?ship=${encodeURIComponent(ship.slug)}`;
      reviewsLink.textContent = `查看 ${ship.name} 評價`;
    } else if (company) {
      reviewsLink.href = `line.html?line=${encodeURIComponent(company.id)}`;
      reviewsLink.textContent = `查看 ${company.name} 評價`;
    }
  </script>
</body>
</html>
