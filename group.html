<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="瀏覽郵輪與河輪旅客的真實評價。">
  <title>郵輪評價｜郵輪評價誌</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="menu"></div>

  <main class="content">
    <div class="page-shell">
      <section class="header-box" id="groupHeader">
        <img src="./images/hero.jpg" alt="郵輪航行於海上的風景">
        <div class="header-content">
          <div>
            <p class="eyebrow" id="groupEyebrow">Cruise reviews</p>
            <h1><span id="groupName">郵輪</span><br>旅客評價</h1>
          </div>
          <div class="header-actions">
            <div class="rating-summary" aria-label="旅客平均評分">
              <strong class="rating-average" data-rating-average>—</strong>
              <div class="rating-summary-details">
                <span class="rating-stars" data-rating-stars aria-hidden="true">★★★★★</span>
                <span class="rating-count" data-rating-count>正在計算評價…</span>
              </div>
            </div>
            <a class="add-button" href="add-review.html">分享搭乘體驗</a>
          </div>
        </div>
      </section>

      <div class="reviews-heading reviews-heading-filter">
        <div>
          <h2>所有最新評價</h2>
          <span>所有內容皆由旅客親自分享</span>
        </div>
        <label class="review-filter">
          <span>依郵輪公司篩選</span>
          <select id="companyFilter">
            <option value="">全部郵輪公司</option>
          </select>
        </label>
      </div>
      <section id="reviews" aria-live="polite"></section>
    </div>
  </main>

  <script src="./catalog-data.js"></script>
  <script src="./site.js"></script>
  <script src="./reviews.js"></script>
  <script src="./group-page.js"></script>
</body>
</html>
