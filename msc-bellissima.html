<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MSC Bellissima 真實旅客評價：住宿、餐飲、服務與船上設施。">
  <title>MSC Bellissima 評價｜郵輪評價誌</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="menu"></div>

  <main class="content">
    <div class="page-shell">
      <section class="header-box">
        <img src="./images/hero.jpg" alt="MSC Bellissima 郵輪">
        <div class="header-content">
          <div>
            <p class="eyebrow">MSC Cruises</p>
            <h1>MSC Bellissima<br>旅客評價</h1>
          </div>
          <div class="header-actions">
            <div class="rating-summary" aria-label="旅客平均評分">
              <strong class="rating-average" data-rating-average>—</strong>
              <div class="rating-summary-details">
                <span class="rating-stars" data-rating-stars aria-hidden="true">★★★★★</span>
                <span class="rating-count" data-rating-count>正在計算評價…</span>
              </div>
            </div>
            <a class="add-button" href="add-review.html">分享搭乘體驗</a>
          </div>
        </div>
      </section>

      <div class="reviews-heading">
        <h2>最新評價</h2>
        <span>住宿 · 餐飲 · 服務 · 設施</span>
      </div>
      <section id="reviews" aria-live="polite"></section>
    </div>
  </main>

  <script src="./site.js"></script>
  <script src="./reviews.js"></script>
  <script>
    loadReviews(opinion => opinion.ship === 'MSC Bellissima');
  </script>
</body>
</html>
