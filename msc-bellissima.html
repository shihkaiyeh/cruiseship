<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>MSC Bellissima</title>

  <!-- STYLE -->
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- MENU -->
  <div id="menu"></div>

  <!-- CONTENT -->
  <div class="content">

    <!-- HEADER -->
    <div class="header-box">
      <img src="images/bellissima.jpg" alt="MSC Bellissima">
      <h1>MSC Bellissima – Opinie</h1>
      <a class="add-button" href="add-review.html">新增評論</a>
    </div>

    <!-- OPINIE -->
    <div id="reviews"></div>

  </div>

  <script src="./reviews.js"></script>
  <script>
    /* ŁADOWANIE MENU */
    fetch('./menu.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('menu').innerHTML = html;

        const buttons = document.querySelectorAll('.menu-button');
        buttons.forEach(button => {
          button.addEventListener('click', () => {
            const submenu = button.nextElementSibling;
            submenu.style.display = submenu.style.display === 'block' ? 'none' : 'block';
          });
        });
      });

    loadReviews(opinion => opinion.ship === "MSC Bellissima");
  </script>

</body>
</html>
