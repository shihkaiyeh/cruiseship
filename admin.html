<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>評價審核</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <header class="admin-topbar">
    <a class="admin-brand" href="/">
      <span class="admin-brand-mark" aria-hidden="true">航</span>
      <strong>郵輪評價誌</strong>
    </a>
    <span>管理員專用後台</span>
  </header>

  <main class="admin-shell">
    <section id="loginView" class="admin-panel">
      <h1>管理員後台</h1>
      <p>請登入以審核使用者提交的評價。</p>

      <form id="loginForm">
        <label for="password">管理員密碼</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="submit">登入</button>
      </form>

      <p id="loginMessage" class="message" role="alert"></p>
    </section>

    <section id="moderationView" class="admin-panel" hidden>
      <header class="admin-header">
        <div>
          <h1>評價審核</h1>
          <p>新提交的評價正在等待你的審核。</p>
        </div>
        <button type="button" id="logoutButton" class="secondary-button">登出</button>
      </header>

      <nav class="filters" aria-label="評價篩選">
        <button type="button" data-filter="pending" class="active">待審核</button>
        <button type="button" data-filter="approved">已通過</button>
        <button type="button" data-filter="rejected">已拒絕</button>
        <button type="button" data-filter="all">全部</button>
      </nav>

      <p id="moderationMessage" class="message" role="status"></p>
      <div id="opinionsList"></div>
    </section>
  </main>

  <script src="/catalog-data.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
